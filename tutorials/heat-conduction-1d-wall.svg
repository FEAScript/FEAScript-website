<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="sans-serif" font-size="15" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <clipPath id="wall"><rect x="210" y="50" width="140" height="180"/></clipPath>
  <g clip-path="url(#wall)" stroke="#000" stroke-width="1">
    <line x1="10" y1="230" x2="190" y2="50"/>
    <line x1="24" y1="230" x2="204" y2="50"/>
    <line x1="38" y1="230" x2="218" y2="50"/>
    <line x1="52" y1="230" x2="232" y2="50"/>
