    <line x1="122" y1="230" x2="302" y2="50"/>
    <line x1="136" y1="230" x2="316" y2="50"/>
    <line x1="150" y1="230" x2="330" y2="50"/>
    <line x1="164" y1="230" x2="344" y2="50"/>
