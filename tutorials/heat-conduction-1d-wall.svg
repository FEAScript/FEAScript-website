<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 580 340" width="580" height="340" font-family="Roboto Mono, monospace" font-size="13" fill="#000">
  <!-- 1D wall, 0.15 m: convection at x = 0, constant temperature at x = 0.15 m -->
  <style>
    .fig { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .fig[fill="#000"], .fig [fill="#000"] { fill: var(--fig-ink, #333333); }
    .fig [stroke="#000"] { stroke: var(--fig-ink, #333333); }
    .fig [fill="#666"] { fill: var(--fig-muted, #6b6960); }
    .fig [fill="#fff"] { fill: var(--fig-bg, #fdfaf2); }
    .fig [stroke="#fff"] { stroke: var(--fig-bg, #fdfaf2); }
    .fig [fill="#f6efd9"] { fill: var(--fig-area, #f6efd9); }
    .fig [stroke="#f6efd9"] { stroke: var(--fig-area, #f6efd9); }
    .fig [stroke="#c8003f"] { stroke: var(--fig-value, #c8003f); }
    .fig [fill="#c8003f"] { fill: var(--fig-value, #c8003f); }
    .fig [stroke="#d4aa00"] { stroke: var(--fig-robin, #d4aa00); }
    .fig [fill="#d4aa00"] { fill: var(--fig-robin, #d4aa00); }
    .fig [stroke="#0086d4"] { stroke: var(--fig-flux, #0086d4); }
    .fig [fill="#0086d4"] { fill: var(--fig-flux, #0086d4); }
    .fig [stroke="#00a86b"] { stroke: var(--fig-zero, #00a86b); }
    .fig [fill="#00a86b"] { fill: var(--fig-zero, #00a86b); }
    .fig [fill="#8f7200"] { fill: var(--fig-gold-ink, #8f7200); }
    .fig [font-size="11"] { font-size: 10px; }
    .fig [font-size="12"] { font-size: 11px; }
    .fig [font-size="13"] { font-size: 12px; }
    .fig [font-size="16"] { font-size: 14px; }
    .fig [font-size="18"] { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0086d4"/>
    </marker>
  </defs>
  <rect x="210" y="50" width="140" height="180" fill="#f6efd9"/>
  <clipPath id="tutorial-wall"><rect x="210" y="50" width="140" height="180"/></clipPath>
  <g clip-path="url(#tutorial-wall)" stroke="#000" stroke-width="0.8" stroke-opacity="0.45"><line x1="30" y1="230" x2="210" y2="50"/><line x1="58" y1="230" x2="238" y2="50"/><line x1="86" y1="230" x2="266" y2="50"/><line x1="114" y1="230" x2="294" y2="50"/><line x1="142" y1="230" x2="322" y2="50"/><line x1="170" y1="230" x2="350" y2="50"/><line x1="198" y1="230" x2="378" y2="50"/><line x1="226" y1="230" x2="406" y2="50"/><line x1="254" y1="230" x2="434" y2="50"/><line x1="282" y1="230" x2="462" y2="50"/><line x1="310" y1="230" x2="490" y2="50"/><line x1="338" y1="230" x2="518" y2="50"/></g>
  <rect x="210" y="50" width="140" height="180" fill="none" stroke="#000" stroke-width="2"/>
  <polyline points="210,50 210,230" fill="none" stroke="#d4aa00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="350,50 350,230" fill="none" stroke="#c8003f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="194" y="115" text-anchor="end">Convection</text>
  <text x="194" y="136" text-anchor="end"><tspan font-style="italic">h</tspan>/<tspan font-style="italic">k</tspan> = 1 m⁻¹</text>
  <text x="194" y="157" text-anchor="end"><tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">∞</tspan><tspan dy="-4"></tspan> = 25 °C</text>
  <text x="194" y="178" font-size="12" fill="#666" text-anchor="end">"left"</text>
  <text x="366" y="125">Constant temperature</text>
  <text x="366" y="146"><tspan font-style="italic">T</tspan> = 5 °C</text>
  <text x="366" y="167" font-size="12" fill="#666">"right"</text>
  <line x1="210" y1="260" x2="350" y2="260" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="280" text-anchor="middle">0.15 m</text>
  <circle cx="210" cy="310" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <line x1="210" y1="310" x2="260" y2="310" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="268" y="315"><tspan font-style="italic">x</tspan></text>
  <text x="210" y="328" font-size="12" text-anchor="middle"><tspan font-style="italic">x</tspan> = 0</text>
</svg>
