<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="15" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <line x1="250" y1="22" x2="390" y2="22" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="27" font-size="15" fill="#000" text-anchor="start"><tspan font-style="italic">u</tspan> = 1 m/s</text>
  <rect x="160" y="80" width="320" height="160" fill="none" stroke="#000" stroke-width="2"/>
  <text x="320.0" y="262" font-size="15" fill="#000" text-anchor="middle">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="320.0" y="278" font-size="12" fill="#666" text-anchor="middle">boundary "0"</text>
  <text x="146" y="160.0" font-size="15" fill="#000" text-anchor="middle" transform="rotate(-90 146 160.0)">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="130" y="160.0" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 130 160.0)">boundary "1"</text>
  <text x="320.0" y="68" font-size="15" fill="#000" text-anchor="middle">Moving lid, <tspan font-style="italic">v</tspan> = 0</text>
  <text x="320.0" y="50" font-size="12" fill="#666" text-anchor="middle">boundary "2"</text>
  <text x="500" y="160.0" font-size="15" fill="#000" text-anchor="middle" transform="rotate(90 500 160.0)">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="516" y="160.0" font-size="12" fill="#666" text-anchor="middle" transform="rotate(90 516 160.0)">boundary "3"</text>
  <text x="320.0" y="153.0" font-size="18" fill="#000" text-anchor="middle">−<tspan font-style="italic">μ</tspan>∇<tspan dy="-6" font-size="11">2</tspan><tspan dy="6"><tspan font-weight="bold">u</tspan> + ∇<tspan font-style="italic">p</tspan> = 0</tspan></text>
  <text x="320.0" y="179.0" font-size="18" fill="#000" text-anchor="middle">∇·<tspan font-weight="bold">u</tspan> = 0</text>
  <line x1="160" y1="304" x2="480" y2="304" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320.0" y="324" text-anchor="middle">4 m</text>
  <line x1="90" y1="80" x2="90" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="80" y="160.0" text-anchor="middle" transform="rotate(-90 80 160.0)">2 m</text>
  <circle cx="160" cy="240" r="3"/>
</svg>
