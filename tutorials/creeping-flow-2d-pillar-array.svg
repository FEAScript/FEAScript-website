<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 680 305" width="680" height="305" font-family="Roboto Mono, monospace" font-size="13" fill="#000">
  <!-- Pillar array: 8 x 2 channel with 8 pillars of radius 0.3, Stokes flow from left to right -->
  <style>
    .fig { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .fig[fill="#000"], .fig [fill="#000"] { fill: var(--fig-ink, #333333); }
    .fig [stroke="#000"] { stroke: var(--fig-ink, #333333); }
    .fig [fill="#666"] { fill: var(--fig-muted, #6b6960); }
    .fig [fill="#fff"] { fill: var(--fig-bg, #fdfaf2); }
    .fig [stroke="#fff"] { stroke: var(--fig-bg, #fdfaf2); }
    .fig [fill="#f6efd9"] { fill: var(--fig-area, #f6efd9); }
    .fig [stroke="#f6efd9"] { stroke: var(--fig-area, #f6efd9); }
    .fig [stroke="#c8003f"] { stroke: var(--fig-heat, #c8003f); }
    .fig [fill="#c8003f"] { fill: var(--fig-heat, #c8003f); }
    .fig [stroke="#d4aa00"] { stroke: var(--fig-gold, #d4aa00); }
    .fig [fill="#d4aa00"] { fill: var(--fig-gold, #d4aa00); }
    .fig [stroke="#0086d4"] { stroke: var(--fig-flow, #0086d4); }
    .fig [fill="#0086d4"] { fill: var(--fig-flow, #0086d4); }
    .fig [stroke="#00a86b"] { stroke: var(--fig-structure, #00a86b); }
    .fig [fill="#00a86b"] { fill: var(--fig-structure, #00a86b); }
    .fig [fill="#8f7200"] { fill: var(--fig-gold-ink, #8f7200); }
    .fig [font-size="11"] { font-size: 10px; }
    .fig [font-size="12"] { font-size: 11px; }
    .fig [font-size="13"] { font-size: 12px; }
    .fig [font-size="16"] { font-size: 14px; }
    .fig [font-size="18"] { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0086d4"/>
    </marker>
    <marker id="arrow-structure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a86b"/>
    </marker>
  </defs>
  <polygon points="100,175 540,175 540,65 100,65" fill="#f6efd9" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="100,175 540,175" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,175 100,65" fill="none" stroke="#0086d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="100,65 540,65" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="540,175 540,65" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="540,175 540,65" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round"/>
  <circle cx="210" cy="147.5" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="210" cy="92.5" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="265" cy="120" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="320" cy="147.5" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="320" cy="92.5" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="375" cy="120" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="430" cy="147.5" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="430" cy="92.5" r="16.5" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="58" y1="164" x2="92" y2="164" stroke="#0086d4" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="58" y1="142" x2="92" y2="142" stroke="#0086d4" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="58" y1="120" x2="92" y2="120" stroke="#0086d4" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="58" y1="98" x2="92" y2="98" stroke="#0086d4" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <line x1="58" y1="76" x2="92" y2="76" stroke="#0086d4" stroke-width="2" marker-end="url(#arrow-flow)"/>
  <text x="38" y="120" text-anchor="middle" transform="rotate(-90 38 120)"><tspan font-style="italic">u</tspan> = 1, <tspan font-style="italic">v</tspan> = 0</text>
  <text x="20" y="120" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 20 120)">"inlet"</text>
  <text x="320" y="53" text-anchor="middle">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="320" y="35" font-size="12" fill="#666" text-anchor="middle">"walls"</text>
  <text x="320" y="197" font-size="12" fill="#666" text-anchor="middle">"walls"</text>
  <text x="560" y="120" text-anchor="middle" transform="rotate(90 560 120)">Stress-free</text>
  <text x="578" y="120" font-size="12" fill="#666" text-anchor="middle" transform="rotate(90 578 120)">"outlet"</text>
  <line x1="295" y1="237" x2="276.55" y2="131.55" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="301" y="237" font-size="13">Pillars, no slip, radius 0.3</text>
  <text x="301" y="253" font-size="12" fill="#666">"pillars"</text>
  <line x1="100" y1="275" x2="540" y2="275" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="295" text-anchor="middle">8</text>
  <line x1="610" y1="175" x2="610" y2="65" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="624" y="120" text-anchor="middle" transform="rotate(90 624 120)">2</text>
  <circle cx="100" cy="175" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <text x="94" y="195" font-size="13" text-anchor="middle">(0, 0)</text>
</svg>
