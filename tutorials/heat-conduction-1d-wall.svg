    <line x1="304" y1="230" x2="484" y2="50"/>
    <line x1="318" y1="230" x2="498" y2="50"/>
    <line x1="332" y1="230" x2="512" y2="50"/>
    <line x1="346" y1="230" x2="526" y2="50"/>
