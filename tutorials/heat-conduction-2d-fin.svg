<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="15" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="160" y="80" width="320" height="160" fill="none" stroke="#000" stroke-width="2"/>
  <text x="320.0" y="262" font-size="15" fill="#000" text-anchor="middle"><tspan font-style="italic">T</tspan> = 200 °C</text>
  <text x="320.0" y="278" font-size="12" fill="#666" text-anchor="middle">boundary "0"</text>
  <text x="146" y="160.0" font-size="15" fill="#000" text-anchor="middle" transform="rotate(-90 146 160.0)">Symmetry</text>
  <text x="130" y="160.0" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 130 160.0)">boundary "1"</text>
  <text x="320.0" y="68" font-size="15" fill="#000" text-anchor="middle">Convection, <tspan font-style="italic">h</tspan> = 1 W/(m²·K), <tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">∞</tspan><tspan dy="-4"> = 20 °C</tspan></text>
  <text x="320.0" y="50" font-size="12" fill="#666" text-anchor="middle">boundary "2"</text>
  <text x="500" y="160.0" font-size="15" fill="#000" text-anchor="middle" transform="rotate(90 500 160.0)"><tspan font-style="italic">T</tspan> = 200 °C</text>
  <text x="516" y="160.0" font-size="12" fill="#666" text-anchor="middle" transform="rotate(90 516 160.0)">boundary "3"</text>
  <text x="320.0" y="166.0" font-size="18" fill="#000" text-anchor="middle">∇<tspan dy="-6" font-size="11">2</tspan><tspan dy="6"><tspan font-style="italic">T</tspan>(<tspan font-style="italic">x</tspan>, <tspan font-style="italic">y</tspan>) = 0</tspan></text>
  <line x1="160" y1="304" x2="480" y2="304" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320.0" y="324" text-anchor="middle">4 m</text>
  <line x1="90" y1="80" x2="90" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="80" y="160.0" text-anchor="middle" transform="rotate(-90 80 160.0)">2 m</text>
  <circle cx="160" cy="240" r="3"/>
</svg>
