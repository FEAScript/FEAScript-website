<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 600 350" width="600" height="350" font-family="Roboto Mono, monospace" font-size="13" fill="#000">
  <!-- Lid-driven cavity: 4 m x 2 m -->
  <style>
    .fig { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .fig[fill="#000"], .fig [fill="#000"] { fill: var(--fig-ink, #333333); }
    .fig [stroke="#000"] { stroke: var(--fig-ink, #333333); }
    .fig [fill="#666"] { fill: var(--fig-muted, #6b6960); }
    .fig [fill="#fff"] { fill: var(--fig-bg, #fdfaf2); }
    .fig [stroke="#fff"] { stroke: var(--fig-bg, #fdfaf2); }
    .fig [fill="#f6efd9"] { fill: var(--fig-area, #f6efd9); }
    .fig [stroke="#f6efd9"] { stroke: var(--fig-area, #f6efd9); }
    .fig [stroke="#c8003f"] { stroke: var(--fig-heat, #c8003f); }
    .fig [fill="#c8003f"] { fill: var(--fig-heat, #c8003f); }
    .fig [stroke="#d4aa00"] { stroke: var(--fig-gold, #d4aa00); }
    .fig [fill="#d4aa00"] { fill: var(--fig-gold, #d4aa00); }
    .fig [stroke="#0086d4"] { stroke: var(--fig-flow, #0086d4); }
    .fig [fill="#0086d4"] { fill: var(--fig-flow, #0086d4); }
    .fig [stroke="#00a86b"] { stroke: var(--fig-structure, #00a86b); }
    .fig [fill="#00a86b"] { fill: var(--fig-structure, #00a86b); }
    .fig [fill="#8f7200"] { fill: var(--fig-gold-ink, #8f7200); }
    .fig [font-size="11"] { font-size: 10px; }
    .fig [font-size="12"] { font-size: 11px; }
    .fig [font-size="13"] { font-size: 12px; }
    .fig [font-size="16"] { font-size: 14px; }
    .fig [font-size="18"] { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0086d4"/>
    </marker>
    <marker id="arrow-structure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a86b"/>
    </marker>
  </defs>
  <polygon points="160,240 480,240 480,80 160,80" fill="#f6efd9" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="160,240 480,240" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,240 160,80" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,80 480,80" fill="none" stroke="#0086d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="480,240 480,80" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="360" y1="32" x2="460" y2="32" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="262" text-anchor="middle">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="320" y="278" font-size="12" fill="#666" text-anchor="middle">"bottom"</text>
  <text x="146" y="160" text-anchor="middle" transform="rotate(-90 146 160)">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="130" y="160" font-size="12" fill="#666" text-anchor="middle" transform="rotate(-90 130 160)">"left"</text>
  <text x="320" y="68" text-anchor="middle">Moving lid, <tspan font-style="italic">u</tspan> = 1 m/s, <tspan font-style="italic">v</tspan> = 0</text>
  <text x="320" y="50" font-size="12" fill="#666" text-anchor="middle">"top"</text>
  <text x="500" y="160" text-anchor="middle" transform="rotate(90 500 160)">No slip, <tspan font-style="italic">u</tspan> = <tspan font-style="italic">v</tspan> = 0</text>
  <text x="516" y="160" font-size="12" fill="#666" text-anchor="middle" transform="rotate(90 516 160)">"right"</text>
  <text x="320" y="152" text-anchor="middle">−<tspan font-style="italic">μ</tspan>∇<tspan dy="-6" font-size="11">2</tspan><tspan dy="6"><tspan font-weight="bold">u</tspan> + ∇<tspan font-style="italic">p</tspan> = 0</tspan></text>
  <text x="320" y="176" text-anchor="middle">∇·<tspan font-weight="bold">u</tspan> = 0</text>
  <circle cx="160" cy="240" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <text x="154" y="260" font-size="13" text-anchor="middle">(0, 0)</text>
  <line x1="160" y1="310" x2="480" y2="310" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="320" y="330" text-anchor="middle">4 m</text>
  <line x1="80" y1="240" x2="80" y2="80" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="70" y="160" text-anchor="middle" transform="rotate(-90 70 160)">2 m</text>
</svg>
