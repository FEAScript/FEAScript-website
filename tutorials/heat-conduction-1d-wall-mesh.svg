<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 580 240" width="580" height="240" font-family="Roboto Mono, monospace" font-size="13" fill="#000">
  <!-- 1D wall: 10 linear elements, 11 nodes -->
  <style>
    .fig { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .fig[fill="#000"], .fig [fill="#000"] { fill: var(--fig-ink, #333333); }
    .fig [stroke="#000"] { stroke: var(--fig-ink, #333333); }
    .fig [fill="#666"] { fill: var(--fig-muted, #6b6960); }
    .fig [fill="#fff"] { fill: var(--fig-bg, #fdfaf2); }
    .fig [stroke="#fff"] { stroke: var(--fig-bg, #fdfaf2); }
    .fig [fill="#f6efd9"] { fill: var(--fig-area, #f6efd9); }
    .fig [stroke="#f6efd9"] { stroke: var(--fig-area, #f6efd9); }
    .fig [stroke="#c8003f"] { stroke: var(--fig-value, #c8003f); }
    .fig [fill="#c8003f"] { fill: var(--fig-value, #c8003f); }
    .fig [stroke="#d4aa00"] { stroke: var(--fig-robin, #d4aa00); }
    .fig [fill="#d4aa00"] { fill: var(--fig-robin, #d4aa00); }
    .fig [stroke="#0086d4"] { stroke: var(--fig-flux, #0086d4); }
    .fig [fill="#0086d4"] { fill: var(--fig-flux, #0086d4); }
    .fig [stroke="#00a86b"] { stroke: var(--fig-zero, #00a86b); }
    .fig [fill="#00a86b"] { fill: var(--fig-zero, #00a86b); }
    .fig [fill="#8f7200"] { fill: var(--fig-gold-ink, #8f7200); }
    .fig [font-size="11"] { font-size: 10px; }
    .fig [font-size="12"] { font-size: 11px; }
    .fig [font-size="13"] { font-size: 12px; }
    .fig [font-size="16"] { font-size: 14px; }
    .fig [font-size="18"] { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-flux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0086d4"/>
    </marker>
  </defs>
  <line x1="80" y1="120" x2="500" y2="120" stroke="#000" stroke-width="2"/>
  <circle cx="80" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="122" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="164" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="206" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="248" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="290" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="332" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="374" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="416" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="458" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="500" cy="120" r="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="80" cy="120" r="5" fill="#d4aa00" stroke="#d4aa00" stroke-width="1.2"/>
  <circle cx="500" cy="120" r="5" fill="#c8003f" stroke="#c8003f" stroke-width="1.2"/>
  <text x="80" y="94" text-anchor="middle">Convection</text>
  <text x="80" y="76" font-size="12" fill="#666" text-anchor="middle">"left"</text>
  <text x="500" y="94" text-anchor="middle"><tspan font-style="italic">T</tspan> = 5 °C</text>
  <text x="500" y="76" font-size="12" fill="#666" text-anchor="middle">"right"</text>
  <line x1="80" y1="155" x2="500" y2="155" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="290" y="175" text-anchor="middle">0.15 m</text>
  <circle cx="80" cy="215" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <line x1="80" y1="215" x2="130" y2="215" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="138" y="220"><tspan font-style="italic">x</tspan></text>
  <text x="80" y="233" font-size="12" text-anchor="middle"><tspan font-style="italic">x</tspan> = 0</text>
</svg>
