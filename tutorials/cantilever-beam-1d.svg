<svg xmlns="http://www.w3.org/2000/svg" class="fig" viewBox="0 0 600 240" width="600" height="240" font-family="Roboto Mono, monospace" font-size="13" fill="#000">
  <!-- Cantilever beam: 4 elements, clamped at node 1, tip load at node 5 -->
  <style>
    .fig { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .fig[fill="#000"], .fig [fill="#000"] { fill: var(--fig-ink, #333333); }
    .fig [stroke="#000"] { stroke: var(--fig-ink, #333333); }
    .fig [fill="#666"] { fill: var(--fig-muted, #6b6960); }
    .fig [fill="#fff"] { fill: var(--fig-bg, #fdfaf2); }
    .fig [stroke="#fff"] { stroke: var(--fig-bg, #fdfaf2); }
    .fig [fill="#f6efd9"] { fill: var(--fig-area, #f6efd9); }
    .fig [stroke="#f6efd9"] { stroke: var(--fig-area, #f6efd9); }
    .fig [stroke="#c8003f"] { stroke: var(--fig-heat, #c8003f); }
    .fig [fill="#c8003f"] { fill: var(--fig-heat, #c8003f); }
    .fig [stroke="#d4aa00"] { stroke: var(--fig-gold, #d4aa00); }
    .fig [fill="#d4aa00"] { fill: var(--fig-gold, #d4aa00); }
    .fig [stroke="#0086d4"] { stroke: var(--fig-flow, #0086d4); }
    .fig [fill="#0086d4"] { fill: var(--fig-flow, #0086d4); }
    .fig [stroke="#00a86b"] { stroke: var(--fig-structure, #00a86b); }
    .fig [fill="#00a86b"] { fill: var(--fig-structure, #00a86b); }
    .fig [fill="#8f7200"] { fill: var(--fig-gold-ink, #8f7200); }
    .fig [font-size="11"] { font-size: 10px; }
    .fig [font-size="12"] { font-size: 11px; }
    .fig [font-size="13"] { font-size: 12px; }
    .fig [font-size="16"] { font-size: 14px; }
    .fig [font-size="18"] { font-size: 15px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0086d4"/>
    </marker>
    <marker id="arrow-structure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00a86b"/>
    </marker>
  </defs>
  <rect x="100" y="115" width="400" height="10" fill="#f6efd9" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="65" x2="100" y2="175" stroke="#000" stroke-width="4"/>
  <g stroke="#000" stroke-width="1"><line x1="100" y1="71" x2="88" y2="83"/><line x1="100" y1="85" x2="88" y2="97"/><line x1="100" y1="99" x2="88" y2="111"/><line x1="100" y1="113" x2="88" y2="125"/><line x1="100" y1="127" x2="88" y2="139"/><line x1="100" y1="141" x2="88" y2="153"/><line x1="100" y1="155" x2="88" y2="167"/><line x1="100" y1="169" x2="88" y2="181"/></g>
  <circle cx="100" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <circle cx="200" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <circle cx="300" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <circle cx="400" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <circle cx="500" cy="120" r="3" fill="#000" stroke="#000" stroke-width="1.2"/>
  <line x1="500" y1="40" x2="500" y2="110" stroke="#00a86b" stroke-width="2.5" marker-end="url(#arrow-structure)"/>
  <text x="512" y="58"><tspan font-style="italic">P</tspan> = −1000 N</text>
  <text x="512" y="76" font-size="12" fill="#666">node "5"</text>
  <text x="100" y="196" text-anchor="middle">Clamped</text>
  <text x="100" y="212" font-size="12" fill="#666" text-anchor="middle">node "1"</text>
  <text x="300" y="90" text-anchor="middle"><tspan font-style="italic">EI</tspan> = 10<tspan dy="-6" font-size="11">5</tspan><tspan dy="6">&#160;N·m²</tspan></text>
  <line x1="100" y1="160" x2="500" y2="160" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="180" text-anchor="middle"><tspan font-style="italic">L</tspan> = 4 m</text>
  <line x1="24" y1="75" x2="24" y2="40" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="24" y1="75" x2="56" y2="75" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="24" y="32" text-anchor="middle"><tspan font-style="italic">w</tspan></text>
  <text x="62" y="79"><tspan font-style="italic">x</tspan></text>
</svg>
