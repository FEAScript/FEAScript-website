  <rect x="210" y="50" width="140" height="180" fill="none" stroke="#000" stroke-width="2"/>
  <text x="194" y="120" font-size="15" fill="#000" text-anchor="end">Convection</text>
  <text x="194" y="142" font-size="15" fill="#000" text-anchor="end"><tspan font-style="italic">h</tspan> = 1 W/(m²·K)</text>
  <text x="194" y="164" font-size="15" fill="#000" text-anchor="end"><tspan font-style="italic">T</tspan><tspan dy="4" font-size="11">∞</tspan><tspan dy="-4"> = 25 °C</tspan></text>
  <text x="194" y="184" font-size="12" fill="#666" text-anchor="end">boundary "0"</text>
  <text x="366" y="130" font-size="15" fill="#000" text-anchor="start">Constant temperature</text>
  <text x="366" y="152" font-size="15" fill="#000" text-anchor="start"><tspan font-style="italic">T</tspan> = 5 °C</text>
  <text x="366" y="172" font-size="12" fill="#666" text-anchor="start">boundary "1"</text>
  <line x1="210" y1="260" x2="350" y2="260" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280.0" y="280" text-anchor="middle">0.15 m</text>
  <line x1="210" y1="310" x2="260" y2="310" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="268" y="315" font-size="15" fill="#000" text-anchor="start"><tspan font-style="italic">x</tspan></text>
  <circle cx="210" cy="310" r="3"/>
  <text x="210" y="330" font-size="13" fill="#000" text-anchor="middle"><tspan font-style="italic">x</tspan> = 0</text>
